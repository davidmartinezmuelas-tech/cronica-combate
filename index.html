<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#26211d" />
    <meta name="description" content="Combate, hoja del jugador conectada con la mesa del máster, bestiario y dados para la 5.ª edición (reglas de 2024). Gratis y en español." />
    <link rel="canonical" href="https://cronicadecombate.com/" />
    <!-- vista previa al compartir el enlace (Discord, WhatsApp, redes) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Crónica de Combate" />
    <meta property="og:title" content="Crónica de Combate" />
    <meta property="og:description" content="Combate, hoja del jugador conectada con la mesa del máster, bestiario y dados para la 5.ª edición (reglas de 2024). Gratis y en español." />
    <meta property="og:url" content="https://cronicadecombate.com/" />
    <meta property="og:image" content="https://cronicadecombate.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Crónica de Combate: combate, hoja del jugador, bestiario y dados. Gratis y en español." />
    <meta property="og:locale" content="es_ES" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Crónica de Combate</title>
  </head>
  <body>
    <!-- el tema se aplica antes de pintar, para que no parpadee -->
    <script>
      (function () {
        try {
          var v = localStorage.getItem('cronica-tema');
          var ok = v === 'slate' || v === 'midnight' || v === 'forest' || v === 'sage' || v === 'linen' || v === 'mist' || v === 'lavender';
          document.documentElement.setAttribute('data-theme', ok ? v : 'dark');
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
